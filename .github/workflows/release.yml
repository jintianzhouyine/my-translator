name: Build & Release (macOS ARM64 + Windows x64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (e.g. v0.10.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing version tag such as v0.10.2' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${manifest.version}`, 'Tag must match package version');
          fs.accessSync(`docs/releases/${process.env.RELEASE_TAG}.md`);
          JS

      - name: Pin source revision for all jobs
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            extension: .dmg
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Windows speech libraries cache
        if: runner.os == 'Windows'
        id: windows-speech-cache
        uses: actions/cache/restore@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.tool_cache }}/my-translator/sherpa-onnx/win-x64
          key: sherpa-onnx-1.13.3-Windows-x64-MD-${{ hashFiles('scripts/prepare-windows-x64.ps1', 'scripts/prepare-windows-speech.mjs') }}

      - name: Prepare Windows x64 speech libraries
        if: runner.os == 'Windows'
        timeout-minutes: 22
        shell: pwsh
        env:
          SHERPA_ONNX_CACHE_DIR: ${{ runner.tool_cache }}/my-translator/sherpa-onnx/win-x64
        run: ./scripts/prepare-windows-x64.ps1

      - name: Save Windows speech libraries cache
        if: runner.os == 'Windows' && steps.windows-speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.tool_cache }}/my-translator/sherpa-onnx/win-x64
          key: sherpa-onnx-1.13.3-Windows-x64-MD-${{ hashFiles('scripts/prepare-windows-x64.ps1', 'scripts/prepare-windows-speech.mjs') }}

      - name: Test translation sessions and settings
        run: npm test

      - name: Test native protocol and audio routing
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --target ${{ matrix.target }}

      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Verify executable architecture and release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.mjs ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*${{ matrix.extension }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Verify installers and calculate checksums
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const files = fs.readdirSync('artifacts').sort();
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.deepEqual(files, [
            `MyTranslator_${version}_aarch64.dmg`,
            `MyTranslator_${version}_x64-setup.exe`,
          ], 'Expected only the macOS ARM64 and Windows x64 installers for this version');
          const checksums = files.map(f => `${createHash('sha256').update(fs.readFileSync(`artifacts/${f}`)).digest('hex')}  ${f}`);
          fs.writeFileSync('artifacts/SHA256SUMS', checksums.join('\n') + '\n');
          console.log(checksums.join('\n'));
          JS

      - name: Publish release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $RELEASE_TAG moved during the build; refusing to publish." >&2
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG 中文版（Mac ARM64 / Windows x64）" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --verify-tag \
            --title "$RELEASE_TAG 中文版（Mac ARM64 / Windows x64）" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
