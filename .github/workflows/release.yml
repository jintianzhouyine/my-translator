name: Build & Release ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            extension: .dmg
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
            extension: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows ARM64 speech libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-arm64.ps1

      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Verify executable architecture and release version
        run: node scripts/verify-release.mjs ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*${{ matrix.extension }}

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Verify installers and calculate checksums
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const files = fs.readdirSync('artifacts').sort();
          assert.equal(files.filter(f => f.endsWith('.dmg')).length, 1, 'Expected one macOS DMG');
          assert.equal(files.filter(f => f.endsWith('.exe')).length, 1, 'Expected one Windows installer');
          const checksums = files.map(f => `${createHash('sha256').update(fs.readFileSync(`artifacts/${f}`)).digest('hex')}  ${f}`);
          fs.writeFileSync('artifacts/SHA256SUMS', checksums.join('\n') + '\n');
          console.log(checksums.join('\n'));
          JS

      - name: Publish release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME 中文版（ARM64）" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
